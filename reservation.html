<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>예약 · 문의 | 구파발경희한의원</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1560d8">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="구파발경희한의원">
<meta property="og:title" content="예약 · 문의 | 구파발경희한의원">
<link rel="canonical" href="https://gupabalhani.org/reservation.html">
<meta property="og:url" content="https://gupabalhani.org/reservation.html">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
<div class="page-head guide-head"><div class="container"><h1>예약 · 문의</h1><p>전화 또는 아래 양식으로 편하게 문의해 주세요.</p></div></div>
<section>
  <div class="container info-grid">
    <div class="panel"><h3>온라인 예약 요청</h3>
      <form class="rsv" id="rsvForm">
        <div class="row2">
          <div class="field"><label for="n">성함</label><input id="n" required autocomplete="name"></div>
          <div class="field"><label for="p">연락처</label><input id="p" type="tel" required autocomplete="tel" placeholder="010-0000-0000"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="d">희망 일자</label><input id="d" type="date"></div>
          <div class="field"><label for="s">진료 분야</label><select id="s"><option>척추 · 관절</option><option>교통사고 후유증</option><option>여성질환</option><option>소화기 · 비염</option><option>한약 상담</option><option>기타</option></select></div>
        </div>
        <div class="field"><label for="m">증상 및 문의</label><textarea id="m" rows="4"></textarea></div>
        <label class="agree"><input type="checkbox" required> 개인정보 수집·이용에 동의합니다. (<a href="privacy.html" style="text-decoration:underline">내용 보기</a>)</label>
        <button class="btn primary" type="submit">예약 요청하기</button>
        <div class="form-msg" id="formMsg" role="status"></div>
      </form>
    </div>
    <div>
      <div class="panel" style="margin-bottom:28px"><img class="panel-img" src="assets/img/guide-visit.jpg" alt="" loading="lazy"><h3>전화 상담</h3>
        <p style="font-size:28px;font-weight:800;color:var(--blue-700)" data-c="phone"></p>
        <table class="hours-table" style="margin-top:10px"><tbody data-hours></tbody></table>
      </div>
      <div class="panel" id="faq"><img class="panel-img" src="assets/img/guide-faq.jpg" alt="" loading="lazy"><h3>자주 묻는 질문</h3>
        <div class="prose">
          <p><strong>Q. 처음 방문 시 준비할 것이 있나요?</strong><br>신분증과 복용 중인 약 정보를 알려주시면 진료에 도움이 됩니다.</p>
          <p style="margin-top:12px"><strong>Q. 진료비는 어떻게 되나요?</strong><br>치료 항목에 따라 달라 내원 또는 전화 문의 시 안내드립니다. [실제 내용으로 수정]</p>
          <p style="margin-top:12px"><strong>Q. 예약 없이 방문해도 되나요?</strong><br>가능하나 예약하시면 대기 시간을 줄일 수 있습니다.</p>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
