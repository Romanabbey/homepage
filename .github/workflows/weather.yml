name: 오늘의 생활 날씨 갱신

on:
  schedule:
    - cron: "7 22 * * *"   # 매일 한국 시간 07:07 (UTC 22:07). 정각을 피해 지연을 줄입니다.
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 날씨 한 줄 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/update_weather.py
      - name: 페이지 다시 만들기
        run: python3 build.py
      - name: 날씨 데이터와 생활안내 페이지만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json lifeguide.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "오늘의 생활 날씨 갱신"
          git push
