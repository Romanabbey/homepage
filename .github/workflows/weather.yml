name: 오늘의 생활 날씨 갱신

on:
  schedule:
    # 매일 한국 시간 07:07 / 07:37 / 08:07 / 09:07 (UTC 22:07 / 22:37 / 23:07 / 00:07).
    # GitHub 예약 실행은 늦어지거나 건너뛸 수 있어 여러 번 걸어 두고, 오늘 자료가 이미 있으면 건너뜁니다.
    - cron: "7 22 * * *"
    - cron: "37 22 * * *"
    - cron: "7 23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 자료가 이미 있는지 확인
        id: check
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"date\": \"$today\"" data/weather.json; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "오늘($today) 자료가 이미 있어 건너뜁니다"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 날씨 한 줄 만들기
        if: steps.check.outputs.done != 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/update_weather.py
      - name: 페이지 다시 만들기
        if: steps.check.outputs.done != 'true'
        run: python3 build.py
      - name: 날씨 데이터와 생활안내 페이지만 커밋
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json lifeguide.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "오늘의 생활 날씨 갱신"
          git push
